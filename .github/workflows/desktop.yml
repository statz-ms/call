name: Statz Desktop Windows
on:
  push:
    branches: [main]
    paths: ['src-tauri/**', 'web/**', 'package.json', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: statz-desktop
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rust stable
        run: rustup update stable --no-self-update
      - name: Dependências
        run: npm install
      - name: Validar áudio e API
        run: npm test
      - name: Verificar captura nativa
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Compilar instalador
        run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: Statz-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
      - name: Publicar instalador
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "desktop-v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "Statz Desktop $version" --notes "Áudio por aplicativo restaurado. Em Áudio, escolha o jogo/app; a captura inclui somente esse aplicativo e seus subprocessos. Windows 10 build 20348 ou Windows 11."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
